
<div class="page-hero" id="top">
  <img src="../assets/img/lotus.jpg" alt="">
  <h1 class="page-hero__title">ご相談・<br>お問い合わせ<small>CONTACT</small></h1>
</div>
__CRUMB__
<main>
  <section class="section">
    <div class="wrapper">
      <p class="lead fade-up">お仏壇・仏具のご購入、修繕のお見積り、お位牌のご注文など、<br class="pc-only">お気軽にお問い合わせください。2営業日以内にご連絡いたします。<br>
      <strong>お急ぎの方はお電話<span class="nowrap">（000-000-0000）</span>が確実です。</strong></p>

      <form class="form js-demo-form fade-up" action="#" method="post">
        <div class="form__row">
          <p class="form__label">ご相談内容<span class="req">必須</span></p>
          <div class="form__checks">
            <label><input type="radio" name="type" value="購入" checked>お仏壇の購入</label>
            <label><input type="radio" name="type" value="修繕">修繕・お見積り</label>
            <label><input type="radio" name="type" value="位牌">お位牌・仏具</label>
            <label><input type="radio" name="type" value="その他">その他</label>
          </div>
        </div>
        <div class="form__row">
          <label for="f-name">お名前<span class="req">必須</span></label>
          <input type="text" id="f-name" name="name" autocomplete="name" required>
        </div>
        <div class="form__row">
          <label for="f-tel">お電話番号<span class="req">必須</span></label>
          <input type="tel" id="f-tel" name="tel" autocomplete="tel" required>
        </div>
        <div class="form__row">
          <label for="f-mail">メールアドレス</label>
          <input type="email" id="f-mail" name="email" autocomplete="email">
        </div>
        <div class="form__row">
          <label for="f-contact">ご希望の連絡方法</label>
          <select id="f-contact" name="contact">
            <option>お電話</option>
            <option>メール</option>
            <option>どちらでも可</option>
          </select>
        </div>
        <div class="form__row">
          <label for="f-body">ご相談内容の詳細</label>
          <textarea id="f-body" name="body" placeholder="例）実家の金仏壇の扉が閉まりにくくなってきました。修繕の費用を知りたいです。"></textarea>
        </div>
        <div class="form__submit">
          <button class="btn" type="submit">送信する</button>
          <p class="form__note">※ 見本のフォームです。公開時に送信先を設定します。</p>
        </div>
      </form>
    </div>
  </section>
</main>
